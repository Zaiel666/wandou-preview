name: Build Windows package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build viewer
        shell: powershell
        run: ./scripts/build.ps1
      - name: Build C4D shell adapter
        shell: cmd
        run: cl /nologo /LD /O2 /MT /EHsc src\Thumbnail.cpp /link /DEF:src\Thumbnail.def /OUT:dist\C4DThumbnail.dll ole32.lib gdi32.lib user32.lib advapi32.lib uuid.lib
      - name: Restore model importer cache
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: vcpkg-assimp-x64-windows-v1
      - name: Install model importer
        shell: cmd
        run: vcpkg install assimp:x64-windows
      - name: Build interactive model viewer and thumbnail adapter
        shell: cmd
        run: >-
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows
          && cmake --build build --config Release
          && cmake --install build --config Release --prefix dist
      - name: Copy model importer runtime
        shell: powershell
        run: Copy-Item C:\vcpkg\installed\x64-windows\bin\*.dll dist\ -Force
      - name: Package
        shell: powershell
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Model-QuickPreview-Windows-x64
          path: dist/Model-QuickPreview-0.2.0-Windows-x64.zip
